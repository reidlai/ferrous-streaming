services:
  iggy-broker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ferrous-streaming-iggy:latest
    container_name: ferrous-iggy-broker
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "8090:8090"
      - "3000:3000"
      - "9092:9092"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config/iggy.toml:/etc/iggy/iggy.toml:ro
      - ./data/iggy:/data/iggy
    environment:
      - IGGY_CONFIG_PATH=/etc/iggy/iggy.toml
      - IGGY_TCP_PORT=8090
      - IGGY_HTTP_PORT=3000
      - IGGY_KAFKA_PORT=9092
      - IGGY_STORAGE_PATH=/data/iggy
      - OTEL_SDK_DISABLED=true
    healthcheck:
      test: ["CMD", "/usr/local/bin/iggy-server", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 50M
