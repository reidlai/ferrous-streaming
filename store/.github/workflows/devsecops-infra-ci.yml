name: Tier-2 DevSecOps Lakehouse Storage CI

on:
  push:
    branches:
      - main
      - 'epic-*'
  pull_request:
    branches:
      - main
      - 'epic-*'

jobs:
  secret-scan:
    name: Gitleaks Secret Zero Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  schema-and-unit-tests:
    name: Schema & Storage Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Delta Schemas & PII Audit
        run: python scripts/validate-schemas.py

      - name: Run Unit Tests
        run: python -m unittest discover tests

  docker-lint-and-security:
    name: Hadolint & Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build Lakehouse Container Image
        run: docker build -t ferrous-lakehouse:latest .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'ferrous-lakehouse:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
