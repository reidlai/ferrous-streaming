# Pre-commit configuration for ferrous-lakehouse
# Enforces DevSecOps shift-left standards, Gitleaks, and schema validation.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: validate-schemas
        name: Validate Delta Lake Schemas & PII Audit
        entry: python scripts/validate-schemas.py
        language: system
        pass_filenames: false
        always_run: true
