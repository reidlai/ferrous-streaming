# Arroyo Stream Processor Configuration for FerrousCX
# Submodule: ferrous-streaming
# Provides Arroyo controller/worker runtime configuration with embedded web UI.

checkpoint-url = "file:///data/arroyo/checkpoints"

[api]
bind-address = "0.0.0.0"
http-port = 5115

[controller]
# Uses embedded scheduler for single-container cluster deployment (avoids "Not enough slots to schedule job" when no external arroyo-node workers are registered; compatible with scheduler = "node" topology)
scheduler = "embedded"
