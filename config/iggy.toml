# Apache Iggy Message Broker Configuration for FerrousCX
# Submodule: ferrous-streaming
# Provides native TCP on port 8090 and HTTP management on port 3000.

path = "/data/iggy"

[node]
advertised_address = "localhost"

[tcp]
enabled = true
address = "0.0.0.0:8090"

[http]
enabled = true
address = "0.0.0.0:3000"

[http.jwt]
algorithm = "HS256"
issuer = "iggy.apache.org"
audience = "iggy.apache.org"
valid_issuers = ["iggy.apache.org"]
valid_audiences = ["iggy.apache.org"]
access_token_expiry = "1h"
clock_skew = "5s"
not_before = "0s"
use_base64_secret = false
encoding_secret = ""
decoding_secret = ""

[memory_pool]
enabled = false
