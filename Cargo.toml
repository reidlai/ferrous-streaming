[workspace]
members = [
    ".",
    "query-service",
]

[package]
name = "ferrous-streaming"
version = "0.1.0"
edition = "2021"
description = "Consolidated data streaming and query platform for FerrousCX"
license = "MIT OR Apache-2.0"

[[bin]]
name = "workload-generator"
path = "src/bin/workload_generator.rs"

[[bin]]
name = "streaming-admin"
path = "src/bin/streaming_admin.rs"

[[bin]]
name = "provision-topics"
path = "src/bin/provision_topics.rs"

[[bin]]
name = "provision-consumer-groups"
path = "src/bin/provision_consumer_groups.rs"

[[bin]]
name = "verify-arroyo"
path = "src/bin/verify_arroyo.rs"

[[bin]]
name = "deploy-pipelines"
path = "src/bin/deploy_pipelines.rs"

[[bin]]
name = "run-hpc-benchmark"
path = "src/bin/run_hpc_benchmark.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.44", features = ["full"] }

[dev-dependencies]
tempfile = "3.17"

[profile.test]
opt-level = 3
debug-assertions = false
overflow-checks = false
